name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '只重打该版本的安卓 APK 并替换到其 Release (如 v1.1.18); 留空则完整构建'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  desktop:
    if: ${{ !inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            # WiX/MSI 在包含多种文件关联时会稳定失败；NSIS 同样是原生安装器且兼容这些关联。
            args: '--bundles nsis'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-onnx-sys stores downloaded native libraries beside Cargo's
          # target output, but Rust cache pruning can restore only the build
          # metadata and leave those libraries missing at the final link step.
          cache-targets: false

      - run: npm ci

      - name: 验证论文 Agent 前端契约
        run: npm run test:paper-agent

      - name: 验证论文 Agent 原生契约
        run: cargo test --manifest-path src-tauri/Cargo.toml agent

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LightRead 轻阅 ${{ github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Linux 最后打包: 等 macOS / Windows / Android 先出包 (安卓失败也照常继续)
  desktop-linux:
    needs: [desktop, android]
    if: ${{ !cancelled() && !inputs.tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev cmake

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false

      - run: npm ci

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LightRead 轻阅 ${{ github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false

  rust-floor:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev cmake
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 检查声明的 Rust 最低版本
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Android 为实验性构建, 失败不阻塞发布
  android:
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v3 默认安装已下架的 `tools` 包, 新版 runner 上会直接失败 (v1.1.17 的 APK 因此缺失)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 NDK
        run: sdkmanager "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 初始化 Android 工程
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npx tauri android init

      # `tauri android init` 生成的工程带的是 Tauri 默认图标; `tauri icon` 产出的
      # Android 图标在 src-tauri/icons/android, 需要覆盖进工程, 否则 APK 显示默认图标 (#5)。
      # 桌面名称沿用 productName (LightRead), 手机桌面图标下只显示「轻阅」
      - name: 写入应用图标与名称
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          test -d "$RES"
          cp -r src-tauri/icons/android/. "$RES/"
          ls "$RES"/mipmap-xxxhdpi
          sed -i -E 's|(<string name="(app_name\|main_activity_title)">)[^<]*(</string>)|\1轻阅\3|' "$RES/values/strings.xml"
          grep -q '>轻阅<' "$RES/values/strings.xml"

      # 自定义 MainActivity: 向前端上报系统栏尺寸, 修复旧版 WebView 下内容顶到状态栏 / 被手势条遮挡
      - name: 写入 MainActivity
        run: |
          DST=src-tauri/gen/android/app/src/main/java/com/yzfly/lightread/MainActivity.kt
          test -f "$DST"
          cp src-tauri/android/MainActivity.kt "$DST"

      # 固定签名: 每个版本的 APK 签名一致, 手机上才能直接覆盖升级 (保留藏书与进度)。
      # 未配置密钥时退回 runner 临时生成的签名, 这样的 APK 无法覆盖安装旧版
      - name: 写入签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_B64, APK 使用临时签名, 无法覆盖升级"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: 构建 APK (debug 签名, 可直接安装)
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          # debug 构建默认带 Rust 调试符号, liblightread_lib.so 会从 ~60MB 涨到 ~240MB
          CARGO_PROFILE_DEV_DEBUG: 0
        run: npx tauri android build --apk --target aarch64 --debug

      - name: 重命名并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" | head -1)
          cp "$APK" "LightRead_${RELEASE_TAG}_android_arm64.apk"
          # 桌面矩阵负责创建 Release；Android 偶尔先编译完，需要等待 Release 可见。
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Release $RELEASE_TAG was not created in time" >&2
              exit 1
            fi
            sleep 10
          done
          gh release upload "$RELEASE_TAG" "LightRead_${RELEASE_TAG}_android_arm64.apk" --clobber
