<style>
:root { --bg: #f4f2ee; --card: #ffffff; --ink: #1f2329; --ink-2: #5a6270; --ink-3: #8a919c; --rule: #e3dfd8; --brand: #0066cf; color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }

.meta { color: var(--ink-3); font-size: 14px; margin: 0 0 36px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 22px; }
.card { margin: 0; }

figcaption p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.zoom { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; place-items: center; padding: 20px; z-index: 9; cursor: zoom-out; }
.zoom.on { display: grid; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  <h1>轻阅金句卡片 · 15 套版式</h1>
  <p class="lede">每张图都由轻阅里的正式渲染器生成，尺寸 1080×1440（小红书 3:4），用 App 打包的思源宋体、霞鹜文楷和得意黑。第二轮改版参考了 GitHub 上的开源卡片生成器（guizang-social-card-skill 的 Editorial / Swiss 体系、md2card 的主题分类）和小红书书摘卡片的常见做法：版式求克制，靠结构而不是装饰；金句按句读分行，并均衡各行长短；短句放大到铺满版面；出处、日期等小字不小于 24px。</p>

const z = document.getElementById('zoom'), zi = z.querySelector('img')
